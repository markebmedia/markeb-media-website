<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Your Password — Markeb Media</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',Arial,sans-serif; background:#f8fafc; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:#fff; border-radius:16px; padding:36px 32px; max-width:400px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.08); }
  h2 { color:#0f172a; font-size:22px; margin-bottom:8px; }
  p { color:#64748b; font-size:13px; margin-bottom:24px; }
  label { font-size:12px; font-weight:600; color:#64748b; text-transform:uppercase; display:block; margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:14px; margin-bottom:16px; }
  button { width:100%; padding:13px; background:#B46100; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:0.6; cursor:not-allowed; }
  .msg { font-size:13px; margin-bottom:16px; padding:10px 12px; border-radius:8px; display:none; }
  .msg.error { display:block; background:#fef2f2; color:#ef4444; }
  .msg.success { display:block; background:#f0fdf4; color:#10b981; }
</style>
</head>
<body>
  <div class="card">
    <h2>Set your password</h2>
    <p>Choose a password to activate your Markeb Media admin account.</p>
    <div class="msg" id="msg"></div>
    <form id="form">
      <label>New Password</label>
      <input type="password" id="password" minlength="8" placeholder="At least 8 characters" required>
      <label>Confirm Password</label>
      <input type="password" id="confirm" minlength="8" placeholder="Re-enter password" required>
      <button type="submit" id="submitBtn">Set Password &amp; Continue</button>
    </form>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const msg = document.getElementById('msg');

if (!token) {
  msg.textContent = 'This link is missing a token. Ask an admin to resend your invite.';
  msg.className = 'msg error';
  document.getElementById('form').style.display = 'none';
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const btn = document.getElementById('submitBtn');

  if (password !== confirm) {
    msg.textContent = 'Passwords do not match.';
    msg.className = 'msg error';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch('/.netlify/functions/admin-set-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();

    if (data.success) {
      msg.textContent = 'Password set. Redirecting to login...';
      msg.className = 'msg success';
      setTimeout(() => { window.location.href = '/admin.html'; }, 1500);
    } else {
      msg.textContent = data.message || 'Something went wrong.';
      msg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = 'Set Password & Continue';
    }
  } catch (err) {
    msg.textContent = 'Network error — please try again.';
    msg.className = 'msg error';
    btn.disabled = false;
    btn.textContent = 'Set Password & Continue';
  }
});
</script>
</body>
</html>
